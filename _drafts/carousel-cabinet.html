<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS — Carousel Cabinet (Draft)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="carousel-cabinet.css">
</head>
<body>
    <header>
        <h1>Welcome to RDS</h1>
        <p class="subtitle">Swipe or click to rotate through the cabinet</p>
    </header>

    <main>
        <section class="nav-panel" aria-label="Drink Categories">
            <h2>Categories</h2>
            <div id="categories" class="btn-row">
                <button class="category-btn" data-category="whiskey">Whiskey</button>
                <button class="category-btn" data-category="gin">Gin</button>
                <button class="category-btn" data-category="others">Others</button>
                <button class="category-btn" data-category="amaro">Amaro et al.</button>
                <button class="category-btn" data-category="new">Recent Acquisitions</button>
            </div>
            <div id="subcategories" class="btn-row"></div>
            <div id="subcategories2" class="btn-row"></div>
        </section>

        <section class="carousel-section" aria-label="Drink Carousel">
            <div class="carousel-header">
                <h3 id="tipples-heading">Tipples</h3>
                <span id="carousel-counter" class="carousel-counter"></span>
            </div>

            <div class="carousel-wrapper">
                <button id="prev-btn" class="carousel-arrow carousel-arrow-prev" aria-label="Previous bottle">
                    &#10094;
                </button>

                <div id="carousel-stage" class="carousel-stage" tabindex="0" aria-live="polite">
                    <!-- 3D rotating drink cards injected here -->
                </div>

                <button id="next-btn" class="carousel-arrow carousel-arrow-next" aria-label="Next bottle">
                    &#10095;
                </button>
            </div>

            <div id="carousel-controls" class="carousel-controls">
                <div id="carousel-dots" class="carousel-dots"></div>
                <input id="carousel-scrubber" class="carousel-scrubber" type="range" min="0" max="0" value="0" aria-label="Jump to bottle">
            </div>

            <p class="swipe-hint">Swipe, drag, click a side card, or use &#8592; &#8594; arrow keys</p>
        </section>
    </main>

    <footer>
        <div>
            <button id="hardcore-btn" title="Unicorns &amp; Rare Reserves">
                <img src="../RD/RD whiskeyman.png" alt="Unicorns" width="220" height="220" onerror="this.onerror=null; this.src='../whiskeyman.png';">
            </button>
        </div>
        <div class="footer-actions">
            <button id="retired-btn">Retired Friends</button>
            <a href="../stave.html">
                <button class="category-btn" type="button">Stave</button>
            </a>
        </div>
    </footer>

    <script src="../scripts/drinkdata.js"></script>
    <script src="carousel-cabinet.js"></script>
</body>
</html>
