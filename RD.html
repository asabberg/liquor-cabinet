<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rachel's Downstairs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background-color: #14191f;
            background-image: url('RD/Wallpaper.jpg');
            background-repeat: repeat;
            background-position: top center;
            background-size: auto 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', Georgia, serif;
        }

        .banner {
            width: 100%;
            background: rgba(18, 22, 28, 0.92);
            border-top: 4px double #c89d45;
            border-bottom: 4px double #c89d45;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
        }

        .banner h1 {
            margin: 0;
            font-family: 'Cinzel', Georgia, serif;
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 700;
            color: #d8b25c;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .banner .divider {
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c89d45, transparent);
            margin: 18px auto;
        }

        .banner p {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(1rem, 2.2vw, 1.5rem);
            font-weight: 400;
            color: #e8d39e;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .banner img {
            display: block;
            margin: 24px auto 0;
            width: 240px;
            max-width: 70vw;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="banner">
        <h1>Rachel's Downstairs</h1>
        <div class="divider"></div>
        <p>Opening Soon</p>
        <img src="RD/Waiting WhiskeyMan.png" alt="Rachel's Downstairs">
    </div>
</body>
</html>
