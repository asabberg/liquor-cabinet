<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/RD-cabinet.css">
</head>
<body>
    <header>
        <button id="menu-toggle-btn" class="header-toggle-btn" type="button" aria-pressed="false">Board Games</button>
        <h1>Welcome to RDS</h1>
<!---     <a href="todays-menu.html">
            <button class="category-btn" style="margin-top: 10px;">Go to Today's Menu</button>
        </a>
        
--->
    </header>
    <div id="liquor-view">
    <main>
        <section>
            <h2>Categories</h2>
            <div id="categories">
                <button class="category-btn" onclick="showSubcategories('whiskey')">Whiskey</button>
                <button class="category-btn" onclick="showSubcategories('gin')">Gin</button>
                <button class="category-btn" onclick="showSubcategories('others')">Others</button>
                <button class="category-btn" onclick="showSubcategories('amaro')">Amaro et al.</button>
                <button class="category-btn" onclick="showSubcategories('new')">Recent Aquistions</button>
               <!-- <button class="category-btn" onclick="showSubcategories('beer')">Beer</button> -->
            </div>
        </section>
        <section>
            <div id="subcategories">
                <!-- Subcategory buttons will be dynamically added here -->
            </div>
        </section>
        <section>
            <div id="subcategories2">
                <!-- Subcategory buttons will be dynamically added here -->
            </div>
        </section>
        <section>
            <h3 id="tipples-heading">Tipples</h3>
            <ul id="drinks-list">
                <!-- Drinks will be displayed here -->
            </ul>
            <div id="drinks-carousel" class="carousel-view is-hidden" aria-label="Recent Acquisitions Carousel">
                <span id="carousel-counter" class="carousel-counter"></span>
                <div class="carousel-wrapper">
                    <button id="carousel-prev-btn" class="carousel-arrow carousel-arrow-prev" type="button" aria-label="Previous bottle">
                        &#10094;
                    </button>
                    <div id="carousel-stage" class="carousel-stage" tabindex="0" aria-live="polite">
                        <!-- 3D rotating drink cards injected here -->
                    </div>
                    <button id="carousel-next-btn" class="carousel-arrow carousel-arrow-next" type="button" aria-label="Next bottle">
                        &#10095;
                    </button>
                </div>
                <div class="carousel-controls">
                    <div id="carousel-dots" class="carousel-dots"></div>
                    <input id="carousel-scrubber" class="carousel-scrubber is-hidden" type="range" min="0" max="0" value="0" aria-label="Jump to bottle">
                </div>
                <p class="swipe-hint">Swipe, drag, click a side card, or use &#8592; &#8594; arrow keys</p>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <button id="hardcore-btn" style="border: none; background: none;">
                <img src="RD/RD whiskeyman.png" alt="WooHoo!" width="300" height="300" onerror="this.onerror=null; this.src='whiskeyman.png';">
            </button>
        </div>
      <!--  <button id="retired-btn">Retired Friends</button> --->
        <a href="stave.html">
            <button class="category-btn">Help Me Pick</button>
        </a>
    </footer>
    </div>

    <div id="boardgames-view" class="is-hidden">
        <main>
            <section>
                <h2>Board Game Categories</h2>
                <div id="bg-categories">
                    <button class="category-btn active-btn" type="button" data-bg-category="all">All Games</button>
                    <button class="category-btn" type="button" data-bg-category="cooperative">Cooperative</button>
                    <button class="category-btn" type="button" data-bg-category="strategy">Strategy &amp; Euro</button>
                    <button class="category-btn" type="button" data-bg-category="party">Party &amp; Family</button>
                    <button class="category-btn" type="button" data-bg-category="deduction">Deduction &amp; Mystery</button>
                    <button class="category-btn" type="button" data-bg-category="campaign">Legacy &amp; Campaign</button>
                </div>
            </section>
            <section>
                <div id="bg-players">
                    <button class="subcategory-btn active-btn" type="button" data-bg-players="any">Any Players</button>
                    <button class="subcategory-btn" type="button" data-bg-players="1">Solo (1P)</button>
                    <button class="subcategory-btn" type="button" data-bg-players="2">2 Players</button>
                    <button class="subcategory-btn" type="button" data-bg-players="3-4">3–4 Players</button>
                    <button class="subcategory-btn" type="button" data-bg-players="5+">5+ Players</button>
                </div>
            </section>
            <section>
                <h3 id="bg-heading">Board Games</h3>
                <ul id="bg-list">
                    <!-- Board games will be displayed here -->
                </ul>
            </section>
        </main>
    </div>

    <script src="scripts/drinkdata.js"></script>
    <script src="scripts/boardgamesdata.js"></script>
    <script src="scripts/liqourcabinet.js"></script>
</body>
</html>
